<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Offline only: this policy blocks every network request (no internet, no CDN, no tracking). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob:; frame-src blob:; object-src blob:; base-uri 'none'; form-action 'none'">
<title>Compare</title>
<style>
:root{
  --bg:#f5f5f3;--panel:#ffffff;--panel2:#f0efeb;--hover:#ecebe6;--text:#1f1f1d;--muted:#66655f;--faint:#9a9890;
  --border:#e3e1da;--border2:#cbc9c0;--accent:#4f46e5;--accent-h:#4338ca;--accent-bg:#eceafd;--accent-text:#3730a3;--on-accent:#fff;
  --danger:#b42318;--danger-bg:#fdecea;--warn:#8a5a00;--warn-bg:#fdf3dc;--ok:#2f6b12;--ok-bg:#e9f4df;--hl:#ffe98a;--hl-text:#1f1f1d;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --radius:8px;--shadow:0 10px 40px rgba(0,0,0,.18);
  --c1-bg:#fdeaea;--c1-fg:#7a1f1f;--c1-st:#f4bcbc;--c1:#e24b4a;
  --c2-bg:#e8f3dc;--c2-fg:#27500a;--c2-st:#bfdc95;--c2:#5e9620;
  --c3-bg:#fbede6;--c3-fg:#712b13;--c3-st:#f3c2ae;--c3:#d85a30;
  --c4-bg:#efedfd;--c4-fg:#3c3489;--c4-st:#cfcaf6;--c4:#7f77dd;
  --c5-bg:#e6f1fb;--c5-fg:#0c447c;--c5-st:#b5d4f4;--c5:#378add;
  --tk-kw:#a626a4;--tk-str:#2e7d32;--tk-num:#b45309;--tk-com:#8a8a85;--tk-tag:#c2410c;--tk-attr:#1d4ed8;
}
[data-theme=dark]{
  --bg:#17171a;--panel:#212125;--panel2:#2a2a2f;--hover:#2f2f35;--text:#ecebe6;--muted:#a9a8a2;--faint:#76756f;
  --border:#34343a;--border2:#4a4a52;--accent:#8b85f5;--accent-h:#a29df8;--accent-bg:#2c2a55;--accent-text:#c9c6fb;--on-accent:#15142b;
  --danger:#f28b82;--danger-bg:#4a1f1d;--warn:#f2c46b;--warn-bg:#47360f;--ok:#9fd07a;--ok-bg:#24391a;--hl:#6b5a12;--hl-text:#fff7cf;--shadow:0 10px 40px rgba(0,0,0,.6);
  --c1-bg:#4a1f1f;--c1-fg:#ffd2d2;--c1-st:#7d2b2b;--c1:#f07a79;
  --c2-bg:#20381a;--c2-fg:#d7f2bd;--c2-st:#3c6a23;--c2:#8fca55;
  --c3-bg:#47261a;--c3-fg:#ffd9c9;--c3-st:#7c3b22;--c3:#ef8a5f;
  --c4-bg:#2b2756;--c4-fg:#dcd9ff;--c4-st:#4a439a;--c4:#a29df8;
  --c5-bg:#13314f;--c5-fg:#cfe5fb;--c5-st:#1f4f80;--c5:#6aaef0;
  --tk-kw:#d58bf0;--tk-str:#8fd18a;--tk-num:#f0b36b;--tk-com:#7d7c76;--tk-tag:#f39a6b;--tk-attr:#8ab4f8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--border2);border-radius:var(--radius);padding:5px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover{background:var(--accent-h)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--hover)}
button.icon{padding:5px 7px}
button.danger{color:var(--danger)}
input[type=text],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--border2);border-radius:var(--radius);padding:6px 9px;outline:none}
input[type=text]:focus,input[type=search]:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
input[type=checkbox]{accent-color:var(--accent);margin:0}
label.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}
.ic-lg{width:20px;height:20px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}.mono{font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);border:1px solid var(--border);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent-bg);color:var(--accent-text);border-color:transparent}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:0 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent-text);cursor:pointer;white-space:nowrap}
.tag .x{cursor:pointer;opacity:.7}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidden{display:none!important}
mark,.hl{background:var(--hl);color:var(--hl-text);border-radius:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:2.5vh 2.5vw}
.modal{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:100%;width:100%;overflow:hidden;border:1px solid var(--border)}
.modal.big{width:95vw;height:95vh}
.modal.mid{max-width:640px}
.modal.small{max-width:440px}
.modal-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.modal-h .title{font-weight:600;font-size:15px}
.modal-b{padding:14px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--border)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>span{font-size:12px;color:var(--muted)}
.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow)}
.toast.err{background:var(--danger);color:#fff}
.menu{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--border2);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:180px}
.menu div{padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
.menu div:hover{background:var(--hover)}
.menu div.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.tk-kw{color:var(--tk-kw)}.tk-str{color:var(--tk-str)}.tk-num{color:var(--tk-num)}.tk-com{color:var(--tk-com);font-style:italic}.tk-tag{color:var(--tk-tag)}.tk-attr{color:var(--tk-attr)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px;border:2px solid transparent;background-clip:padding-box}

/* ---------- compare view ---------- */
.cmp{display:flex;flex-direction:column;height:100%;min-height:0}
.cmp-top{display:flex;flex-direction:column;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.cmp-files{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cmp-file{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 9px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);font-size:13px;max-width:280px}
.cmp-file .sw{width:10px;height:10px;border-radius:3px;flex:none}
.cmp-file .base{font-size:11px;background:var(--accent-bg);color:var(--accent-text);padding:0 6px;border-radius:5px}
.cmp-opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:13px}
.cmp-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.cmp-grid{flex:1;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.65;min-height:0}
.cmp-head{position:sticky;top:0;z-index:2;display:grid;background:var(--panel);border-bottom:1px solid var(--border)}
.cmp-head>div{display:flex;align-items:center;gap:6px;padding:6px 8px;font-family:var(--sans);font-size:13px;border-left:1px solid var(--border);min-width:0}
.cmp-head>div:first-child{border-left:0}
.cmp-head select{padding:2px 6px;font-size:12px;max-width:100%}
.cmp-row{display:grid}
.cmp-cell{display:flex;min-width:0;border-left:1px solid var(--border)}
.cmp-cell:first-child{border-left:0}
.cmp-cell .ln{width:46px;flex:none;text-align:right;padding-right:8px;color:var(--faint);user-select:none}
.cmp-cell .tx{white-space:pre-wrap;word-break:break-all;flex:1;min-width:0;padding-right:8px}
.cmp-cell.empty{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--border) 5px 6px)}
.cmp-cell.k1{background:var(--c1-bg);color:var(--c1-fg)} .cmp-cell.k1 .ln{color:var(--c1-fg)} .k1 .d{background:var(--c1-st);border-radius:2px}
.cmp-cell.k2{background:var(--c2-bg);color:var(--c2-fg)} .cmp-cell.k2 .ln{color:var(--c2-fg)} .k2 .d{background:var(--c2-st);border-radius:2px}
.cmp-cell.k3{background:var(--c3-bg);color:var(--c3-fg)} .cmp-cell.k3 .ln{color:var(--c3-fg)} .k3 .d{background:var(--c3-st);border-radius:2px}
.cmp-cell.k4{background:var(--c4-bg);color:var(--c4-fg)} .cmp-cell.k4 .ln{color:var(--c4-fg)} .k4 .d{background:var(--c4-st);border-radius:2px}
.cmp-cell.k5{background:var(--c5-bg);color:var(--c5-fg)} .cmp-cell.k5 .ln{color:var(--c5-fg)} .k5 .d{background:var(--c5-st);border-radius:2px}
.cmp-row.cur{outline:2px solid var(--accent);outline-offset:-2px}
.cmp-row.sel .cmp-cell{box-shadow:inset 0 0 0 9999px rgba(79,70,229,.08)}
.cmp-fold{padding:3px 12px;color:var(--muted);font-family:var(--sans);font-size:12px;background:var(--panel2);cursor:pointer;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.cmp-fold:hover{color:var(--accent)}
.cmp-path{display:flex;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--border);font-size:12px}
.cmp-path code{color:var(--accent-text);background:var(--accent-bg);padding:1px 7px;border-radius:5px;font-family:var(--mono)}
.cmp-err{margin:10px 14px;padding:8px 12px;border-radius:8px;background:var(--danger-bg);color:var(--danger);font-size:13px}
.cmp-empty{padding:40px;text-align:center;color:var(--muted)}
.dropzone{border:2px dashed var(--border2);border-radius:12px;padding:24px;text-align:center;color:var(--muted);cursor:pointer}
.dropzone.over{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text)}

#app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border)}
.top .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;min-width:0;max-width:260px;cursor:pointer}
.top .brand .ic{color:var(--accent)}
.sbox{flex:1;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.sinput{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:0 10px}
.sinput:focus-within{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-bg)}
.sinput input{border:0!important;background:transparent!important;box-shadow:none!important;flex:1;padding:7px 0;outline:none}
.sinput kbd{font-size:11px;color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:0 5px}
.sopts{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px;padding:2px 2px 0}
.sadv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;padding:8px 10px;background:var(--panel2);border-radius:8px;margin-top:2px}
.sadv select{padding:2px 6px;font-size:12px}
.theme-sw{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.theme-sw button{border-radius:0;border:0;padding:4px 7px}
.theme-sw button.on{background:var(--accent-bg);color:var(--accent-text)}
.body{flex:1;display:flex;min-height:0}
#side{width:250px;flex:none;border-right:1px solid var(--border);overflow:auto;padding:8px 6px;background:var(--panel)}
#side.hide{display:none}
#main{flex:1;overflow:auto;min-width:0}
.wrap{max-width:1100px;margin:0 auto;padding:18px 22px 60px}
.tree-row{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text);user-select:none}
.tree-row:hover{background:var(--hover)}
.tree-row.on{background:var(--accent-bg);color:var(--accent-text)}
.tree-row .tw{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--faint);flex:none}
.tree-row .cnt{margin-left:auto;font-size:11px;color:var(--faint)}
.tree-row.drop,.sub.drop{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-bg)}
.side-sec{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);padding:10px 8px 4px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px}
.crumbs a{color:var(--accent-text);text-decoration:none;cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.ptitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ptitle h1{font-size:22px;margin:0;font-weight:600;flex:1;min-width:0}
.sec{font-size:12px;color:var(--muted);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.list{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.sub{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);cursor:pointer}
.sub:first-child{border-top:0}
.sub:hover{background:var(--hover)}
.sub .nm{font-weight:600;font-size:15px;color:var(--accent-text)}
.sub .ic{color:var(--accent)}
.fcard{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--border);cursor:pointer}
.fcard:first-child{border-top:0}
.fcard:hover{background:var(--hover)}
.fcard .ficon{color:var(--muted)}
.fcard .ficon.note{color:var(--accent)} .fcard .ficon.log{color:var(--danger)}
.fcard .nm{font-weight:500}
.fcard .meta{font-size:12px;color:var(--faint);white-space:nowrap}
.fcard .tags{display:flex;gap:4px;flex-wrap:wrap}
.fcard .acts{display:flex;gap:2px;opacity:.55}
.fcard:hover .acts{opacity:1}
.star.on{color:#d99a00}
.imgsec{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px}
.imgsec h3{margin:0;font-size:16px;font-weight:600;flex:1;min-width:0}
.imgsec .imgbox{margin-top:10px;border-radius:8px;overflow:hidden;background:var(--panel2);cursor:zoom-in;min-height:60px;display:flex;align-items:center;justify-content:center}
.imgsec .imgbox img{max-width:100%;display:block}
.imgsec .meta{font-size:12px;color:var(--faint);margin-top:6px;display:flex;gap:10px}
.drophint{border:1px dashed var(--border2);border-radius:10px;padding:10px;text-align:center;font-size:12.5px;color:var(--muted);margin-top:16px}
.drophint.over{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-text)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);font-size:17px;margin:0 0 6px;font-weight:600}
/* home */
.hgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.hgrid{grid-template-columns:minmax(0,1fr)}#side{display:none}}
.qc{padding:12px 14px;margin-bottom:16px;border-color:var(--accent)}
.qc input{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:6px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.stat .l{font-size:12px;color:var(--muted)} .stat .v{font-size:22px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile .ic{color:var(--accent);width:22px;height:22px}
.tile b{display:block;margin-top:4px;font-weight:600}
.tile span{font-size:12px;color:var(--muted)}
.tagcloud{display:flex;gap:6px;flex-wrap:wrap}
/* search results */
.res{padding:10px 14px;border-top:1px solid var(--border);cursor:pointer}
.res:first-child{border-top:0}
.res:hover{background:var(--hover)}
.res .path{font-size:12px;color:var(--faint)}
.res .lines{font-family:var(--mono);font-size:12px;margin-top:6px;display:flex;flex-direction:column;gap:2px}
.res .lines div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);padding:1px 6px;border-radius:4px}
.res .lines div:hover{background:var(--accent-bg);color:var(--text)}
.res .lines .lno{color:var(--faint);display:inline-block;min-width:44px}
.notice{padding:8px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px;margin-bottom:10px}
/* viewer modal */
.vh .path{font-size:12px;color:var(--faint)}
.vtool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--border)}
.vtool .sinput{min-width:280px;flex:0 1 380px}
.vtool [data-mc]{white-space:nowrap}
.vtool .sinput input{padding:4px 0}
.lines-v{flex:1;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.7;padding:6px 0;background:var(--panel2)}
.lines-v .l{display:flex;padding-right:12px}
.lines-v .l .n{width:64px;flex:none;text-align:right;padding-right:12px;color:var(--faint);user-select:none}
.lines-v .l .t{white-space:pre;flex:1}
.lines-v.wrap .l .t{white-space:pre-wrap;word-break:break-all}
.lines-v .l.e{background:var(--danger-bg);color:var(--danger)} .lines-v .l.e .n{color:var(--danger)}
.lines-v .l.w{background:var(--warn-bg);color:var(--warn)} .lines-v .l.w .n{color:var(--warn)}
.lines-v .l.sel{box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-bg)}
.lines-v .l.cur mark{outline:2px solid var(--accent)}
.lines-v .more{padding:10px;text-align:center}
.vfoot{display:flex;align-items:center;gap:12px;padding:6px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.chip.e{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.chip.w{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.off{opacity:.45}
/* image viewer */
.iv{flex:1;overflow:hidden;background:var(--panel2);position:relative;cursor:grab}
.iv img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
/* editor */
.ed{display:flex;flex-direction:column;min-height:0;min-width:0;flex:1}
.ed-find{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--panel2);font-size:12.5px}
.ed-find input{padding:3px 8px;font-size:12.5px;width:200px}
.ed-wrap{flex:1;display:flex;min-height:0;position:relative;background:var(--panel)}
.ed-gutter{margin:0;padding:10px 10px 10px 0;width:56px;flex:none;text-align:right;color:var(--faint);font:12.5px/1.7 var(--mono);overflow:hidden;user-select:none;background:var(--panel2);border-right:1px solid var(--border)}
.ed-ta{flex:1;border:0!important;border-radius:0!important;box-shadow:none!important;resize:none;padding:10px 14px;font:12.5px/1.7 var(--mono);background:var(--panel)!important;tab-size:2;white-space:pre;overflow:auto}
.ed.wrapped .ed-ta{white-space:pre-wrap}
.ed.wrapped .ed-gutter{display:none}
.mdtool{display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--panel2)}
.mdtool button{border:0;background:transparent;padding:4px 7px;border-radius:6px}
.mdtool button:hover{background:var(--hover)}
.mdtool .sep{width:1px;height:18px;background:var(--border2);margin:0 4px}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:3px 10px;font-size:12px;background:var(--panel)}
.seg button.on{background:var(--accent-bg);color:var(--accent-text)}
.mdpanes{flex:1;display:flex;min-height:0}
.mdpanes>.ed{border-right:1px solid var(--border)}
.mdpanes.v-source .mdprev{display:none}
.mdpanes.v-formatted>.ed{display:none}
.mdprev{flex:1;overflow:auto;padding:18px 26px;min-width:0}
.banner{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--warn-bg);color:var(--warn);font-size:13px}
/* rendered markdown */
.md{max-width:860px;line-height:1.65;font-size:14.5px}
.md h1{font-size:24px;margin:.2em 0 .6em;font-weight:650}
.md h2{font-size:19px;margin:1.3em 0 .5em;font-weight:650;padding-bottom:4px;border-bottom:1px solid var(--border)}
.md h3{font-size:16px;margin:1.2em 0 .4em;font-weight:650}
.md h4,.md h5,.md h6{font-size:14.5px;margin:1em 0 .3em}
.md p{margin:.5em 0}
.md code{font-family:var(--mono);font-size:.88em;background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
.md pre.md-code{position:relative;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;overflow:auto;font-size:12.5px;line-height:1.6}
.md pre.md-code code{background:none;border:0;padding:0;font-size:inherit}
.md .md-lang{position:absolute;top:4px;right:8px;font-size:11px;color:var(--faint);font-family:var(--sans)}
.md blockquote{margin:.6em 0;padding:4px 14px;border-left:3px solid var(--accent);background:var(--accent-bg);border-radius:0;color:var(--text)}
.md ul,.md ol{padding-left:24px;margin:.4em 0}
.md li.md-task{list-style:none;margin-left:-20px}
.md li.md-task input{margin-right:6px;vertical-align:-1px;cursor:pointer}
.md li.md-task .done{color:var(--muted);text-decoration:line-through}
.md .md-table-wrap{overflow:auto;margin:.6em 0}
.md table{border-collapse:collapse;font-size:13.5px}
.md th,.md td{border:1px solid var(--border2);padding:5px 10px;text-align:left}
.md th{background:var(--panel2);font-weight:600}
.md hr{border:0;border-top:1px solid var(--border2);margin:1.2em 0}
.md a{color:var(--accent-text)}
.md img{max-width:100%;border-radius:6px;border:1px solid var(--border)}
.md .img-blocked{display:inline-block;font-size:12px;color:var(--muted);border:1px dashed var(--border2);padding:6px 10px;border-radius:6px}
.tpl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tpl div{border:1px solid var(--border);border-radius:8px;padding:10px 6px;text-align:center;cursor:pointer;font-size:13px}
.tpl div .ic{width:20px;height:20px;display:block;margin:0 auto 4px;color:var(--muted)}
.tpl div.on{border:2px solid var(--accent);padding:9px 5px;background:var(--accent-bg);color:var(--accent-text)}
.tpl div.on .ic{color:var(--accent)}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--border2);border-radius:8px;padding:5px 8px;background:var(--panel)}
.tagbox input{border:0!important;box-shadow:none!important;padding:2px!important;flex:1;min-width:120px;background:transparent!important}
.pick-list{max-height:52vh;overflow:auto;border:1px solid var(--border);border-radius:8px;margin-top:8px}
.pick-list label{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--border);cursor:pointer;font-size:13px}
.pick-list label:first-child{border-top:0}
.pick-list label:hover{background:var(--hover)}
.hist div.h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--border)}
.hist div.h:first-child{border-top:0}
.welcome{max-width:560px;margin:12vh auto;text-align:center;padding:0 20px}
.welcome .logo{width:56px;height:56px;border-radius:14px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.welcome .logo .ic{width:30px;height:30px}
.welcome h1{font-size:26px;margin:0 0 8px}
.welcome .acts{display:flex;gap:10px;justify-content:center;margin:22px 0;flex-wrap:wrap}
.welcome .acts button{padding:9px 16px;font-size:14.5px}
.welcome .safe{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}

.sfw{max-width:1180px}
.sfhint{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border-radius:8px;background:var(--accent-bg);color:var(--accent-text);font-size:13px;margin:0 0 12px}
.sfhint .ic{margin-top:2px}
.sftabs{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px}
.sftabs button{border:0;border-radius:0;background:transparent;padding:7px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.sftabs button.on{color:var(--accent-text);border-bottom-color:var(--accent);font-weight:500}
.sftabs.small button{font-size:13px;padding:6px 10px}
.sfcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.sfcard.promo.open{border-color:var(--accent)}
.sfcardh{display:flex;align-items:center;gap:8px;margin:-2px 0 0}
.sfcard.open .sfcardh{margin-bottom:10px}
.sfcardh .idx{font-size:11px;background:var(--panel2);border-radius:5px;padding:0 6px;color:var(--muted)}
.sfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px;margin-bottom:6px}
.sff{display:flex;flex-direction:column;gap:3px;min-width:0;margin-bottom:6px}
.sff>span{font-size:12px;color:var(--muted)}
.sff>em{font-style:normal;font-size:11.5px;color:var(--faint)}
.sff input[type=text],.sff select,.sff textarea,.sff input[type=datetime-local],.sff input[type=date]{width:100%;min-width:0}
.sff.wide{grid-column:1/-1}
.sff .row input{flex:1;min-width:0}
.sfsec{font-size:13px;font-weight:600;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sfsub{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px;display:flex;align-items:center;gap:8px}
.loc .lt-row{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:4px}
.loc .lt{border:0;background:transparent;font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:6px;color:var(--muted)}
.loc .lt.on{background:var(--accent-bg);color:var(--accent-text)}
.loc input,.loc textarea{width:100%}
.sftable{overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--panel);margin-bottom:6px}
.sftable table{border-collapse:collapse;width:100%;font-size:13px}
.sftable th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);background:var(--panel2);padding:6px 8px;white-space:nowrap}
.sftable td{padding:4px 6px;border-top:1px solid var(--border);vertical-align:middle}
.sftable td input,.sftable td select{width:100%;padding:4px 7px;font-size:12.5px}
.sftable td input[type=text]{font-family:var(--mono)}
.sftable tr.del td{background:var(--danger-bg)}
.sftable td.acts{white-space:nowrap}
.sfcond{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.sfcond select{max-width:180px}
.sfcond .w120{width:140px}
.sfcond .grow{flex:1;min-width:180px;font-family:var(--mono);font-size:12.5px}
.sfrow3{display:grid;grid-template-columns:1fr 2fr 140px 32px;gap:6px;margin-bottom:6px}
.cin{display:inline-flex;align-items:center;gap:4px}
.cin input{width:90px}
.sffoot{position:sticky;bottom:0;background:var(--bg);padding:10px 0;border-top:1px solid var(--border);margin-top:14px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;z-index:3}
.issues{margin:0;padding-left:18px;font-size:12.5px;max-height:120px;overflow:auto}
.issues li.e{color:var(--danger)} .issues li.w{color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip .x{cursor:pointer;margin-left:2px}
.sfxml{height:60vh;display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel)}
.sfnote{margin-bottom:8px}
.side-tog{cursor:pointer;user-select:none}
.side-tog:hover{color:var(--accent)}

    var ps = q('[data-paste]'); if (ps) ps.onclick = async function () {
      var v = await UI.ask({ title: 'Paste text to compare', size: 'mid', ok: 'Add', fields: [{ name: 'name', label: 'Name', value: 'Pasted ' + (st.files.length + 1) }, { name: 'text', label: 'Content', type: 'textarea', rows: 14, placeholder: '<order>...</order>  or  { "key": "value" }' }], validate: function (v) { return v.text.trim() ? '' : 'Paste some content first'; } });
      if (v) addFiles([{ name: v.name || 'Pasted', text: v.text }]);
    };
    qa('[data-switch]').forEach(function (s) { s.onchange = function () { var j = +s.getAttribute('data-switch'); if (j === 1) st.p2 = +s.value; else st.p3 = +s.value; st.cur = -1; render(); }; });
    var c3 = q('[data-close3]'); if (c3) c3.onclick = function () { st.third = false; st.cur = -1; render(); };
    var t3 = q('[data-third]'); if (t3) t3.onclick = function () { st.third = true; st.p3 = null; render(); };
    var pv = q('[data-prev]'); if (pv) pv.onclick = function () { go(-1); };
    var nx = q('[data-next]'); if (nx) nx.onclick = function () { go(1); };
    qa('[data-unfold]').forEach(function (u) { u.onclick = function () { st.o.onlyChanges = false; UI.store('fv-cmp-opts', st.o); render(); }; });
    var grid = q('.cmp-grid');
    if (grid) grid.onclick = function (e) {
      var row = e.target.closest('.cmp-row'); if (!row) return;
      container.querySelectorAll('.cmp-row.sel').forEach(function (x) { x.classList.remove('sel'); });
      row.classList.add('sel'); st.sel = +row.getAttribute('data-r');
      q('[data-path]').textContent = pathOf(st.sel) || '—';
    };
    var cp = q('[data-copypath]'); if (cp) cp.onclick = function () { var t = q('[data-path]').textContent; if (t && t !== '—') { navigator.clipboard.writeText(t).then(function () { UI.toast('Path copied'); }, function () { UI.toast('Copy not allowed here', true); }); } };
    var rp = q('[data-report]'); if (rp) rp.onclick = function () { opts.saveReport(reportName(), report()); };
    // drop files onto the view
    container.ondragover = function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0) e.preventDefault(); };
    container.ondrop = async function (e) {
      if (!e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault();
      var list = []; for (var i = 0; i < e.dataTransfer.files.length; i++) { var f = e.dataTransfer.files[i]; list.push({ name: f.name, text: await f.text() }); }
      addFiles(list);
    };
  }
  function reportName() { return 'Compare report ' + UI.stamp() + '.md'; }
  function report() {
    var lines = ['# Compare report', '', 'Date: ' + UI.fmtDate(Date.now(), true), 'Mode: ' + st.mode.toUpperCase(), '', '## Files', ''];
    st.files.forEach(function (f, i) { lines.push((i + 1) + '. ' + f.name + (i === 0 ? ' (base)' : '')); });
    var o = { ignoreKeyOrder: st.o.ignoreOrder, ignoreAttrOrder: st.o.ignoreOrder, ignoreArrayOrder: st.o.ignoreArrayOrder, ignoreFields: st.o.fields.split(',').map(function (s) { return s.trim(); }).filter(Boolean) };
    var eq = E.makeEq(st.mode, { ignoreWhitespace: st.o.ignoreWhitespace, ignoreCase: st.o.ignoreCase });
    var nb; try { nb = E.normalize(st.mode, st.files[0].text, o); } catch (e) { nb = E.normalizeText(st.files[0].text); }
    for (var i = 1; i < st.files.length; i++) {
      var nf; try { nf = E.normalize(st.mode, st.files[i].text, o); } catch (e) { nf = E.normalizeText(st.files[i].text); }
      var rows = E.align([nb, nf], eq).filter(function (r) { return r.changed; });
      lines.push('', '## ' + (i + 1) + ' · ' + st.files[i].name + ' vs base — ' + rows.length + ' changed line' + (rows.length === 1 ? '' : 's'), '');
      if (!rows.length) { lines.push('No differences.'); continue; }
      lines.push('| Path | Base | ' + st.files[i].name.replace(/\|/g, '/') + ' |', '|---|---|---|');
      rows.slice(0, 500).forEach(function (r) {
        var a = r.cells[0].n != null ? nb.lines[r.cells[0].n].trim() : '—', b = r.cells[1].n != null ? nf.lines[r.cells[1].n].trim() : '—';
        var p = r.cells[0].n != null ? nb.paths[r.cells[0].n] : nf.paths[r.cells[1].n];
        var cell = function (s) { return '`' + s.replace(/\|/g, '\\|').replace(/`/g, "'").slice(0, 200) + '`'; };
        lines.push('| ' + cell(p) + ' | ' + cell(a) + ' | ' + cell(b) + ' |');
      });
      if (rows.length > 500) lines.push('', '…and ' + (rows.length - 500) + ' more.');
    }
    return lines.join('\n') + '\n';
  }
  function onKey(e) {
    if (!container.isConnected) { document.removeEventListener('keydown', onKey); return; }
    if (e.key === 'F7') { e.preventDefault(); go(e.shiftKey ? -1 : 1); }
  }
  document.addEventListener('keydown', onKey);
  render();
  return { addFiles: addFiles, getFiles: function () { return st.files; }, getMode: function () { return st.mode; }, render: render };
}

/* Compare — standalone app with its own dashboard. */
(function () {
  'use strict';
  var esc = UI.esc, app = document.getElementById('app');
  var RECENT = 'fv-compare-recent';
  UI.Theme.init();

  function recent() { return UI.store(RECENT) || []; }
  function remember(files, mode) {
    if (files.length < 2) return;
    var size = files.reduce(function (a, f) { return a + f.text.length; }, 0);
    var r = recent().filter(function (c) { return c.names.join('|') !== files.map(function (f) { return f.name; }).join('|'); });
    r.unshift({ mode: mode, names: files.map(function (f) { return f.name; }), files: size < 1500000 ? files.map(function (f) { return { name: f.name, text: f.text }; }) : null, t: Date.now() });
    try { UI.store(RECENT, r.slice(0, 8)); } catch (e) { }
  }

  function dashboard() {
    var r = recent();
    app.innerHTML = '<header class="top"><div class="brand">' + ICONS('compare', 'ic-lg') + '<span>Compare</span></div><span class="grow"></span>' + UI.themeSwitch() + '</header>' +
      '<main id="main" style="overflow:auto;flex:1"><div class="wrap" style="max-width:820px">' +
      '<div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:6px">' +
      '<div class="tile" data-mode="xml">' + ICONS('fileCode') + '<b>XML compare</b><span>Ignores attribute order and formatting</span></div>' +
      '<div class="tile" data-mode="json">' + ICONS('braces') + '<b>JSON compare</b><span>Ignores key order and formatting</span></div>' +
      '<div class="tile" data-mode="text">' + ICONS('compare') + '<b>Text compare</b><span>Logs, notes, anything</span></div></div>' +
      '<div class="dropzone" id="dz" style="margin-top:16px">' + ICONS('upload', 'ic-lg') + '<div style="margin-top:6px">Drop 2–5 files here, or <b>click to pick files</b></div><div class="small faint">The type is detected from the first file. You can also paste text inside the compare screen.</div></div>' +
      '<div class="sec">' + ICONS('history') + ' Recent compares</div>' +
      (r.length ? '<div class="list">' + r.map(function (c, i) {
        return '<div class="sub" data-recent="' + i + '">' + ICONS(c.mode === 'json' ? 'braces' : c.mode === 'xml' ? 'fileCode' : 'compare') + '<span class="grow ellip">' + esc(c.names.join('  vs  ')) + '</span><span class="small faint">' + c.names.length + ' files · ' + UI.ago(c.t) + '</span>' +
          (c.files ? '' : '<span class="small faint">(too large to keep)</span>') + '<button class="ghost icon" data-del="' + i + '" title="Remove">' + ICONS('x') + '</button></div>';
      }).join('') + '</div>' : '<div class="card empty">Compares you run show up here, kept only in this browser.</div>') +
      '<p class="safe small muted" style="margin-top:22px;text-align:center">' + ICONS('lock') + ' Works offline. Files are read in this browser and never uploaded.</p>' +
      '</div></main>';
    UI.Theme.apply();
    app.querySelectorAll('[data-mode]').forEach(function (t) { t.onclick = function () { open(t.getAttribute('data-mode'), []); }; });
    var dz = app.querySelector('#dz');
    dz.onclick = function () { pick(5).then(function (fs) { if (fs && fs.length) open(null, fs); }); };
    dz.ondragover = function (e) { e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = function () { dz.classList.remove('over'); };
    dz.ondrop = async function (e) { e.preventDefault(); dz.classList.remove('over'); var fs = await readList(e.dataTransfer.files, 5); if (fs.length) open(null, fs); };
    app.querySelectorAll('[data-recent]').forEach(function (row) {
      row.onclick = function (e) {
        if (e.target.closest('[data-del]')) return;
        var c = r[+row.getAttribute('data-recent')];
        if (c.files) open(c.mode, c.files.map(function (f) { return { name: f.name, text: f.text }; }), true); else UI.toast('Those files were too large to keep. Add them again.', true);
      };
    });
    app.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); var list = recent(); list.splice(+b.getAttribute('data-del'), 1); UI.store(RECENT, list); dashboard(); }; });
  }
  async function readList(list, max) { var out = []; for (var i = 0; i < list.length && out.length < max; i++) out.push({ name: list[i].name, text: await list[i].text() }); return out; }
  function pick(max) {
    return new Promise(function (res) {
      var inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true;
      inp.onchange = async function () { res(await readList(inp.files, max)); };
      inp.click();
    });
  }
  function open(mode, files, keepMode) {
    app.innerHTML = '<header class="top"><button class="ghost" id="back">' + ICONS('left') + 'Dashboard</button><div class="brand">' + ICONS('compare', 'ic-lg') + '<span>Compare</span></div><span class="grow"></span>' + UI.themeSwitch() + '</header>' +
      '<div style="flex:1;min-height:0;background:var(--panel)" id="cv"></div>';
    UI.Theme.apply();
    app.querySelector('#back').onclick = dashboard;
    var view = CompareView(app.querySelector('#cv'), {
      files: files, mode: mode, keepMode: keepMode,
      pickers: [{ label: 'Add file', icon: 'plus', pick: pick }],
      saveReport: function (name, md) { UI.download(name, md, 'text/markdown'); UI.toast('Report downloaded'); },
      onChange: function (fs, md) { remember(fs, md); }
    });
    if (files.length >= 2) remember(view.getFiles(), view.getMode());
  }
  dashboard();
})();

</script>
